<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // Step 2: Keyboard controls (arrow keys)
        document.addEventListener("keydown", function (event) {
            switch (event.key) {
                case "ArrowUp":
                    if (direction.y === 0) direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) direction = { x: 1, y: 0 };
                    break;
                case " ":
                    if (gameOver) resetGame();
                    break;
                case "p":
                case "P":
                    if (!gameOver) {
                        paused = !paused;
                        if (paused) clearInterval(gameTimer);
                        else startTimer();
                    }
                    break;
                default:
                    return;
            }
            event.preventDefault();
        });

        // Step 3: Eating and growing
        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
        }

        // Step 4: Game over
        const info = document.getElementById("info");
        let gameOver = false;

        function isCollision(head) {
            const hitWall = head.x < 0 || head.x >= tileCount ||
                            head.y < 0 || head.y >= tileCount;
            const hitSelf = snake.some(seg => seg.x === head.x && seg.y === head.y);
            return hitWall || hitSelf;
        }

        function endGame() {
            clearInterval(gameTimer);
            gameOver = true;
            info.textContent = `Game over! Score: ${score}  |  High score: ${highScore}  |  Press Space to restart`;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            direction = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            paused = false;
            placeFood();
            drawGame();
            updateInfo();
            startTimer();
        }

        // Step 5: Improvements
        let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
        let paused = false;
        let gameTimer;

        function getSpeed() {
            return Math.max(60, 200 - score * 5);
        }

        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(moveSnake, getSpeed());
        }

        function updateInfo() {
            info.textContent = `Score: ${score}  |  High score: ${highScore}  |  P = pause`;
        }

       
        function moveSnake() {
            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (isCollision(newHead)) {
                endGame();
                return;
            }

            const ateFood = newHead.x === food.x && newHead.y === food.y;

            snake.unshift(newHead);

            if (ateFood) {
                score++;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                placeFood();
                startTimer();
                updateInfo();
            } else {
                snake.pop();
            }

            drawGame();
        }

        // Start the game
        updateInfo();
        startTimer();
    </script>

</body>
</html>
